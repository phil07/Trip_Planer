name: Android-APK

# Baut bei jedem Push auf main eine signierte APK und legt dafür eine Release an, getaggt mit der Version aus
# Trip-Planer/version.js. Gibt es diese Version schon, passiert nichts. Die App prüft die neueste Release.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    name: APK bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Der Runner hat das Android SDK schon installiert (ANDROID_HOME); nur die Lizenzen müssen akzeptiert werden.
      - name: Android-Lizenzen akzeptieren
        if: steps.ver.outputs.new == 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Version aus version.js lesen und prüfen, ob schon eine Release existiert
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(sed -n "s/.*APP_VERSION = '\([^']*\)'.*/\1/p" Trip-Planer/version.js)
          [ -n "$TAG" ] || { echo "::error::APP_VERSION nicht gefunden"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG gibt es schon, nichts zu tun."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.ver.outputs.new == 'true'
        run: npm ci

      - name: Web-Dateien in das Android-Projekt kopieren
        if: steps.ver.outputs.new == 'true'
        run: npx cap sync android

      - name: Signierschlüssel aus Secret schreiben
        if: steps.ver.outputs.new == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: APK bauen
        if: steps.ver.outputs.new == 'true'
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.ver.outputs.tag }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease

      - name: Release mit APK anlegen
        if: steps.ver.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk "trip-planer-${TAG}.apk"
          gh release create "$TAG" "trip-planer-${TAG}.apk" --target "$GITHUB_SHA" \
            --title "$TAG" --notes "Automatisch gebaut aus Commit ${GITHUB_SHA:0:7}." --latest
